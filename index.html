<title>Startech – Yellow-dot connectivity</title>
<style>
@font-face { font-family: "Startech Aeonik"; font-weight: 400; font-display: swap; src: url("assets/fonts/StartechAeonik-Regular.woff2") format("woff2"); }
@font-face { font-family: "Startech Aeonik Fono"; font-weight: 400; font-display: swap; src: url("assets/fonts/StartechAeonikFono-Regular.woff2") format("woff2"); }
:root { --yellow: #FFD700; --silicon: #32383C; --titanium: #BCBBB6; --aluminium: #ECEBE5; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--aluminium); color: var(--silicon); font-family: "Startech Aeonik", Inter, Arial, sans-serif;
  display: grid; place-items: center; padding: 24px; -webkit-font-smoothing: antialiased; }
body.checking main { visibility: hidden; }
main { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
.logo { width: 168px; height: auto; color: var(--silicon); }
form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
label { font-family: "Startech Aeonik Fono", Inter, Arial, sans-serif; font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; text-align: center; opacity: .6; }
.field { display: flex; align-items: center; background: #fff; border-radius: 999px; padding: 6px 6px 6px 22px;
  border: 1px solid transparent; transition: border-color .2s; }
.field:focus-within { border-color: var(--titanium); }
input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 17px; color: inherit; padding: 10px 0; }
button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--yellow); cursor: pointer;
  display: grid; place-items: center; transition: transform .2s; }
button:hover { transform: scale(1.06); }
button svg { width: 18px; height: 18px; }
.error { min-height: 20px; margin: 0; font-size: 14px; text-align: center; opacity: 0; transition: opacity .2s; }
.error.show { opacity: .8; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>

MeGWTooG+SIY5efA==", ITER = 200000, STORE = "startech-staging-key";
  var un = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var subtle = window.crypto.subtle;

  function open(raw) {
    return subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
      .then(function (k) { return subtle.decrypt({ name: "AES-GCM", iv: un(IV) }, k, un(DATA)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  // Replace the whole document only once this gate has finished parsing; otherwise
  // document.write would merge into the gate instead of replacing it.
  function show(html) {
    var go = function () { setTimeout(function () { document.open(); document.write(html); document.close(); }, 0); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
  }
  function derive(pw) {
    return subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"])
      .then(function (k) { return subtle.deriveBits({ name: "PBKDF2", salt: un(SALT), iterations: ITER, hash: "SHA-256" }, k, 256); })

  function saved() { try { var s = localStorage.getItem(STORE); return s ? un(s) : null; } catch (e) { return null; } }

  var form = document.getElementById("f"), input = document.getElementById("p"), err = document.getElementById("e");
  function showForm() { document.body.classList.remove("checking"); input.focus(); }

  var k = saved();
  if (k) open(k).then(show).catch(function () { try { localStorage.removeItem(STORE); } catch (e) {} showForm(); });
  else showForm();

    ev.preventDefault();
    var raw;
    derive(input.value.trim().toLowerCase())
      .then(function (r) { raw = r; return open(r); })
      .then(function (html) { save(raw); show(html); })
      .catch(function () {
        err.classList.add("show");
        form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
